info:
  name: registerCompanyLogo
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4500/store/registerCompanyLogo
  body:
    type: multipart-form
    data:
      - name: companyLogo
        type: file
        value:
          - /D:/EH LOGO.webp
      - name: theme
        type: text
        value: black
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
