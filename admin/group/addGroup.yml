info:
  name: addGroup
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4500/admin/group/addGroup
  body:
    type: multipart-form
    data:
      - name: groupImage
        type: file
        value:
          - postman-cloud:///1f00aebd-1b5a-44a0-8933-9cc4db3fe0ea
      - name: groupName
        type: text
        value: gold
      - name: groupDescription
        type: text
        value: Gold is always gold
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
